<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Viewer - Media Search</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section { margin: 20px 0; }
        .table-list { display: flex; gap: 10px; flex-wrap: wrap; }
        .table-btn { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .table-btn:hover { background: #0056b3; }
        .table-container { margin: 20px 0; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .query-section { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
        .execute-btn { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .execute-btn:hover { background: #218838; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 4px; }
        .pagination { margin: 20px 0; }
        .pagination button { margin: 0 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Database Viewer - Media Search Service</h1>
        <p>View live data from your SQLite database</p>
    </div>

    <div class="section">
        <h2>Tables</h2>
        <div class="table-list" id="tableList">
            <button onclick="loadTables()">Load Tables</button>
        </div>
    </div>

    <div class="section table-container" id="tableContainer" style="display: none;">
        <h2>Table Data</h2>
        <div id="tableData"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div class="section query-section">
        <h2>Custom Query</h2>
        <textarea id="queryInput" placeholder="Enter your SELECT query here..."></textarea>
        <br>
        <button class="execute-btn" onclick="executeQuery()">Execute Query</button>
        <div id="queryResult"></div>
    </div>

    <script>
        let currentTable = '';
        let currentOffset = 0;
        const limit = 50;

        async function loadTables() {
            try {
                const response = await fetch('/db/tables');
                const data = await response.json();
                
                const tableList = document.getElementById('tableList');
                tableList.innerHTML = '';
                
                data.tables.forEach(table => {
                    const btn = document.createElement('button');
                    btn.className = 'table-btn';
                    btn.textContent = table;
                    btn.onclick = () => loadTable(table);
                    tableList.appendChild(btn);
                });
            } catch (error) {
                console.error('Error loading tables:', error);
            }
        }

        async function loadTable(tableName, offset = 0) {
            try {
                currentTable = tableName;
                currentOffset = offset;
                
                const response = await fetch(`/db/table/${tableName}?limit=${limit}&offset=${offset}`);
                const data = await response.json();
                
                const tableContainer = document.getElementById('tableContainer');
                const tableData = document.getElementById('tableData');
                
                tableContainer.style.display = 'block';
                
                let html = `<h3>${tableName} (${data.total_count} rows)</h3>`;
                
                if (data.rows.length > 0) {
                    html += '<table><thead><tr>';
                    data.columns.forEach(col => {
                        html += `<th>${col}</th>`;
                    });
                    html += '</tr></thead><tbody>';
                    
                    data.rows.forEach(row => {
                        html += '<tr>';
                        data.columns.forEach(col => {
                            let value = row[col];
                            if (typeof value === 'string' && value.length > 100) {
                                value = value.substring(0, 100) + '...';
                            }
                            html += `<td>${value || ''}</td>`;
                        });
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                } else {
                    html += '<p>No data found</p>';
                }
                
                tableData.innerHTML = html;
                
                // Update pagination
                updatePagination(data.total_count);
                
            } catch (error) {
                console.error('Error loading table:', error);
                document.getElementById('tableData').innerHTML = '<div class="error">Error loading table data</div>';
            }
        }

        function updatePagination(totalCount) {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(totalCount / limit);
            const currentPage = Math.floor(currentOffset / limit) + 1;
            
            let html = '';
            
            if (currentPage > 1) {
                html += `<button onclick="loadTable('${currentTable}', ${(currentPage - 2) * limit})">Previous</button>`;
            }
            
            html += `<span>Page ${currentPage} of ${totalPages}</span>`;
            
            if (currentPage < totalPages) {
                html += `<button onclick="loadTable('${currentTable}', ${currentPage * limit})">Next</button>`;
            }
            
            pagination.innerHTML = html;
        }

        async function executeQuery() {
            const query = document.getElementById('queryInput').value;
            const resultDiv = document.getElementById('queryResult');
            
            if (!query.trim()) {
                resultDiv.innerHTML = '<div class="error">Please enter a query</div>';
                return;
            }
            
            try {
                const response = await fetch('/db/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }
                
                let html = `<h3>Query Results (${data.row_count} rows)</h3>`;
                
                if (data.rows.length > 0) {
                    html += '<table><thead><tr>';
                    data.columns.forEach(col => {
                        html += `<th>${col}</th>`;
                    });
                    html += '</tr></thead><tbody>';
                    
                    data.rows.forEach(row => {
                        html += '<tr>';
                        data.columns.forEach(col => {
                            let value = row[col];
                            if (typeof value === 'string' && value.length > 100) {
                                value = value.substring(0, 100) + '...';
                            }
                            html += `<td>${value || ''}</td>`;
                        });
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                } else {
                    html += '<p>No results found</p>';
                }
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error executing query:', error);
                resultDiv.innerHTML = '<div class="error">Error executing query</div>';
            }
        }

        // Load tables on page load
        window.onload = loadTables;
    </script>
</body>
</html>
