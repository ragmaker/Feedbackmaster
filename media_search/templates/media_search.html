<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSearch - AI-Powered Media Discovery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        /* Glassmorphism styles */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            position: sticky;
            top: 20px;
            z-index: 100;
            margin-bottom: 30px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            color: white;
        }

        .logo-section h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .file-count {
            font-size: 14px;
            opacity: 0.9;
        }

        .view-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 5px;
            gap: 5px;
        }

        .view-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .view-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Search Section */
        .search-section {
            margin-bottom: 30px;
        }

        .search-container {
            position: relative;
            padding: 25px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 18px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            placeholder-color: #666;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-btn {
            padding: 18px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Results Section */
        .results-section {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            max-height: calc(100vh - 280px);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .results-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .sort-controls select {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }

        /* Grid View */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px 0;
        }

        .media-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .media-thumbnail {
            width: 100%;
            height: 120px;
            background: linear-gradient(45deg, #f3f4f6, #e5e7eb);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .media-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .media-icon {
            font-size: 32px;
            color: #9ca3af;
        }

        .media-type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
        }

        .media-type-video { background: #ef4444; }
        .media-type-audio { background: #10b981; }
        .media-type-image { background: #3b82f6; }
        .media-type-document { background: #f59e0b; }

        .media-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1f2937;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-summary {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 10px;
        }

        .similarity-score {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* List View */
        .media-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .media-list-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .media-list-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        }

        .list-thumbnail {
            width: 80px;
            height: 60px;
            background: linear-gradient(45deg, #f3f4f6, #e5e7eb);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .list-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .list-info {
            flex: 1;
        }

        .list-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #1f2937;
        }

        .list-info p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .list-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #9ca3af;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            padding: 5px;
        }

        .close-btn:hover {
            color: #1f2937;
        }

        .modal-media {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-label {
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .detail-value {
            color: #6b7280;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .empty-state p {
            font-size: 16px;
            opacity: 0.7;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header-content {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .search-box {
                flex-direction: column;
                gap: 15px;
            }

            .search-input,
            .search-btn {
                width: 100%;
            }

            .media-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .media-list-item {
                flex-direction: column;
                text-align: center;
            }

            .modal-content {
                margin: 20px;
                max-width: calc(100% - 40px);
            }

            .modal-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .logo-section h1 {
                font-size: 24px;
            }

            .search-input,
            .search-btn {
                padding: 15px 20px;
            }

            .media-card {
                padding: 15px;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="glass header-content">
                <div class="logo-section">
                    <h1>MediaSearch</h1>
                    <div class="file-count">
                        <span id="fileCount">0</span> files indexed
                    </div>
                    <div class="mode-indicator" id="modeIndicator" style="display: none; color: #10b981; font-size: 12px; margin-top: 5px;">
                        🖥️ Desktop Mode
                    </div>
                </div>
                <div class="view-controls">
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="grid">
                            <span>🔲</span> Grid
                        </button>
                        <button class="view-btn" data-view="list">
                            <span>📄</span> List
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- User Login Section -->
        <section class="user-login-section" id="userLoginSection">
            <div class="glass search-container">
                <div class="login-content">
                    <h2 style="color: white; text-align: center; margin-bottom: 20px;">🔐 Enter Your User ID</h2>
                    <div class="search-box">
                        <input 
                            type="text" 
                            class="search-input" 
                            placeholder="Enter your user ID (e.g., 84a51d8e-40f0-4061-afcd-4b1255d8d2b1)"
                            id="userIdInput"
                        >
                        <button class="search-btn" id="loginBtn">
                            🚀 Connect
                        </button>
                    </div>
                    <p style="color: rgba(255,255,255,0.8); text-align: center; margin-top: 15px; font-size: 14px;">
                        Don't have a user ID? Contact your administrator or check the API documentation.
                    </p>
                </div>
            </div>
        </section>

        <!-- Search Section -->
        <section class="search-section" id="searchSection" style="display: none;">
            <div class="glass search-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span style="color: white; font-size: 14px;">
                        👤 User: <span id="currentUserId" style="font-family: monospace;"></span>
                    </span>
                    <button onclick="logout()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 15px; cursor: pointer; font-size: 12px;">
                        🚪 Change User
                    </button>
                </div>
                <div class="search-box">
                    <input 
                        type="text" 
                        class="search-input" 
                        placeholder="Search photos, videos, documents... Try 'sunset photos' or 'meeting recordings'"
                        id="searchInput"
                    >
                    <button class="search-btn" id="searchBtn">
                        🔍 Search
                    </button>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="results-section glass">
            <div class="results-header">
                <div class="results-info">
                    <span id="resultsCount">0</span> results found
                </div>
                <div class="sort-controls">
                    <select id="sortBy">
                        <option value="relevance">Sort by Relevance</option>
                        <option value="date">Sort by Date</option>
                        <option value="name">Sort by Name</option>
                        <option value="size">Sort by Size</option>
                    </select>
                </div>
            </div>

            <!-- Loading State -->
            <div class="loading" id="loadingState" style="display: none;">
                <div class="spinner"></div>
                <span style="margin-left: 15px;">Searching...</span>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <h3>✨ Discover Your Media</h3>
                <p>Search using natural language to find exactly what you're looking for</p>
            </div>

            <!-- Results Grid -->
            <div class="media-grid" id="mediaGrid" style="display: none;">
                <!-- Media cards will be inserted here -->
            </div>

            <!-- Results List -->
            <div class="media-list" id="mediaList" style="display: none;">
                <!-- Media list items will be inserted here -->
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div class="modal" id="mediaModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Media Details</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            
            <div id="modalMediaContainer">
                <!-- Media preview will be inserted here -->
            </div>
            
            <div class="modal-details" id="modalDetails">
                <!-- Details will be inserted here -->
            </div>
            
            <div class="modal-actions">
                <button class="action-btn btn-secondary" id="copyPathBtn">📋 Copy Path</button>
                <button class="action-btn btn-primary" id="openFileBtn">📁 Open File</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:5001';
        let USER_ID = localStorage.getItem('media_search_user_id') || null;
        let currentView = 'grid';
        let currentResults = [];
        let allFiles = [];
        
        // Detect if running in desktop mode (PyWebView)
        const isDesktopMode = window.navigator.userAgent.includes('QtWebEngine') || 
                            window.pywebview !== undefined || 
                            window.location.protocol === 'file:' ||
                            window.chrome === undefined;

        // DOM Elements
        const userLoginSection = document.getElementById('userLoginSection');
        const searchSection = document.getElementById('searchSection');
        const userIdInput = document.getElementById('userIdInput');
        const loginBtn = document.getElementById('loginBtn');
        const currentUserIdEl = document.getElementById('currentUserId');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const fileCountEl = document.getElementById('fileCount');
        const resultsCountEl = document.getElementById('resultsCount');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const mediaGrid = document.getElementById('mediaGrid');
        const mediaList = document.getElementById('mediaList');
        const modal = document.getElementById('mediaModal');
        const sortBy = document.getElementById('sortBy');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            checkUserLogin();
        });

        function setupEventListeners() {
            // Login functionality
            loginBtn.addEventListener('click', handleLogin);
            userIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            // Search functionality
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });

            // View toggle
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentView = btn.dataset.view;
                    renderResults(currentResults);
                });
            });

            // Sort functionality
            sortBy.addEventListener('change', () => {
                const sortedResults = sortResults(currentResults, sortBy.value);
                renderResults(sortedResults);
            });

            // Modal functionality
            document.getElementById('closeModal').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // Escape key to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.style.display === 'block') {
                    closeModal();
                }
            });
        }

        function checkUserLogin() {
            // Show desktop mode indicator
            if (isDesktopMode) {
                showNotification('🖥️ Running in Desktop Mode - Direct file access enabled!', 'info');
                document.title = '🖥️ MediaSearch Desktop';
                document.getElementById('modeIndicator').style.display = 'block';
            } else {
                showNotification('🌐 Running in Web Mode - Files served via HTTP', 'info');
            }
            
            if (USER_ID) {
                showMainInterface();
                loadAllFiles();
            } else {
                showLoginInterface();
            }
        }

        function showLoginInterface() {
            userLoginSection.style.display = 'block';
            searchSection.style.display = 'none';
            document.querySelector('.results-section').style.display = 'none';
        }

        function showMainInterface() {
            userLoginSection.style.display = 'none';
            searchSection.style.display = 'block';
            document.querySelector('.results-section').style.display = 'block';
            currentUserIdEl.textContent = USER_ID.substring(0, 8) + '...';
        }

        async function handleLogin() {
            const userId = userIdInput.value.trim();
            
            if (!userId) {
                showError('Please enter a valid user ID');
                return;
            }

            // Test the user ID by trying to fetch files
            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/files?user_id=${encodeURIComponent(userId)}&limit=1`);
                
                if (response.ok) {
                    USER_ID = userId;
                    localStorage.setItem('media_search_user_id', userId);
                    showMainInterface();
                    loadAllFiles();
                    showNotification('Successfully connected!');
                } else {
                    showError('Invalid user ID or server error. Please check your user ID.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Failed to connect. Please check your connection and try again.');
            } finally {
                hideLoading();
            }
        }

        function logout() {
            USER_ID = null;
            localStorage.removeItem('media_search_user_id');
            userIdInput.value = '';
            allFiles = [];
            currentResults = [];
            showLoginInterface();
            showNotification('Logged out successfully');
        }

        async function loadAllFiles() {
            try {
                const response = await fetch(`${API_BASE}/api/files?user_id=${USER_ID}&limit=1000`);
                const data = await response.json();
                allFiles = data.files || [];
                fileCountEl.textContent = allFiles.length;
                
                // Show all files initially
                currentResults = allFiles;
                renderResults(currentResults);
            } catch (error) {
                console.error('Error loading files:', error);
                showError('Failed to load files');
            }
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                currentResults = allFiles;
                renderResults(currentResults);
                return;
            }

            showLoading();
            
            try {
                const response = await fetch(`${API_BASE}/api/search/combined?q=${encodeURIComponent(query)}&user_id=${USER_ID}&top_k=50`);
                const data = await response.json();
                
                currentResults = data.results || [];
                renderResults(currentResults);
            } catch (error) {
                console.error('Error searching:', error);
                showError('Search failed. Please try again.');
            } finally {
                hideLoading();
            }
        }

        function renderResults(results) {
            resultsCountEl.textContent = results.length;
            
            if (results.length === 0) {
                showEmptyState();
                return;
            }

            hideEmptyState();
            
            if (currentView === 'grid') {
                renderGridView(results);
            } else {
                renderListView(results);
            }
        }

        function renderGridView(results) {
            mediaGrid.style.display = 'grid';
            mediaList.style.display = 'none';
            
            mediaGrid.innerHTML = results.map(file => `
                <div class="media-card" onclick="openModal('${file.file_id}')">
                    <div class="media-thumbnail">
                        ${getMediaThumbnail(file)}
                        <div class="media-type-badge media-type-${getMediaType(file.format)}">
                            ${getMediaType(file.format)}
                        </div>
                    </div>
                    <div class="media-info">
                        <h3>${file.filename || 'Untitled'}</h3>
                        <p class="media-summary">${file.summary_text || 'No summary available'}</p>
                        <div class="media-meta">
                            <span>${formatDate(file.created_at)}</span>
                            ${file.similarity_score ? `<span class="similarity-score">${Math.round(file.similarity_score * 100)}%</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderListView(results) {
            mediaGrid.style.display = 'none';
            mediaList.style.display = 'flex';
            
            mediaList.innerHTML = results.map(file => `
                <div class="media-list-item" onclick="openModal('${file.file_id}')">
                    <div class="list-thumbnail">
                        ${getMediaThumbnail(file)}
                    </div>
                    <div class="list-info">
                        <h3>${file.filename || 'Untitled'}</h3>
                        <p>${file.summary_text || 'No summary available'}</p>
                        <div class="list-meta">
                            <span>📅 ${formatDate(file.created_at)}</span>
                            <span>📁 ${getMediaType(file.format)}</span>
                            ${file.duration ? `<span>⏱️ ${formatDuration(file.duration)}</span>` : ''}
                            ${file.similarity_score ? `<span class="similarity-score">${Math.round(file.similarity_score * 100)}%</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getMediaThumbnail(file) {
            const type = getMediaType(file.format);
            const icons = {
                video: '🎥',
                audio: '🎵',
                image: '🖼️',
                document: '📄'
            };
            
            return `<div class="media-icon">${icons[type] || '📄'}</div>`;
        }

        function getMediaType(format) {
            if (!format) return 'document';
            
            const videoFormats = ['mp4', 'avi', 'mov', 'mkv', 'wmv', 'flv', 'webm'];
            const audioFormats = ['mp3', 'wav', 'flac', 'aac', 'ogg', 'wma'];
            const imageFormats = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp'];
            
            const ext = format.toLowerCase();
            
            if (videoFormats.includes(ext)) return 'video';
            if (audioFormats.includes(ext)) return 'audio';
            if (imageFormats.includes(ext)) return 'image';
            
            return 'document';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function formatDuration(seconds) {
            if (!seconds) return '';
            
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        function sortResults(results, sortBy) {
            const sorted = [...results];
            
            switch (sortBy) {
                case 'date':
                    return sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                case 'name':
                    return sorted.sort((a, b) => (a.filename || '').localeCompare(b.filename || ''));
                case 'size':
                    return sorted.sort((a, b) => (b.duration || 0) - (a.duration || 0));
                case 'relevance':
                default:
                    return sorted.sort((a, b) => (b.similarity_score || 0) - (a.similarity_score || 0));
            }
        }

        function openModal(fileId) {
            const file = currentResults.find(f => f.file_id === fileId) || allFiles.find(f => f.file_id === fileId);
            if (!file) return;
            
            // Update modal content
            document.getElementById('modalTitle').textContent = file.filename || 'Untitled';
            
            // Media preview
            const mediaContainer = document.getElementById('modalMediaContainer');
            const mediaType = getMediaType(file.format);
            
            // Generate file URL based on mode
            let fileUrl;
            if (isDesktopMode) {
                // In desktop mode, use direct file path
                fileUrl = `file://${file.file_path}`;
            } else {
                // In web mode, use HTTP serving endpoint
                fileUrl = `${API_BASE}/api/files/${file.file_id}/serve?user_id=${encodeURIComponent(USER_ID)}`;
            }
            
            if (mediaType === 'video') {
                mediaContainer.innerHTML = `
                    <video class="modal-media" controls>
                        <source src="${fileUrl}" type="video/${file.format}">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else if (mediaType === 'audio') {
                mediaContainer.innerHTML = `
                    <audio class="modal-media" controls style="width: 100%;">
                        <source src="${fileUrl}" type="audio/${file.format}">
                        Your browser does not support the audio element.
                    </audio>
                `;
            } else if (mediaType === 'image') {
                mediaContainer.innerHTML = `
                    <img class="modal-media" src="${fileUrl}" alt="${file.filename}">
                `;
            } else {
                mediaContainer.innerHTML = `
                    <div class="modal-media" style="background: #f3f4f6; display: flex; align-items: center; justify-content: center;">
                        <div style="text-align: center;">
                            <div style="font-size: 48px; margin-bottom: 10px;">📄</div>
                            <p>Document preview not available</p>
                        </div>
                    </div>
                `;
            }
            
            // Details
            const details = document.getElementById('modalDetails');
            details.innerHTML = `
                <div class="detail-item">
                    <span class="detail-label">Filename</span>
                    <span class="detail-value">${file.filename || 'N/A'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Format</span>
                    <span class="detail-value">${file.format || 'N/A'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Duration</span>
                    <span class="detail-value">${file.duration ? formatDuration(file.duration) : 'N/A'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Resolution</span>
                    <span class="detail-value">${file.resolution || 'N/A'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Owner</span>
                    <span class="detail-value">${file.owner || 'N/A'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Topic</span>
                    <span class="detail-value">${file.topic || 'N/A'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Upload Date</span>
                    <span class="detail-value">${formatDate(file.created_at)}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Similarity Score</span>
                    <span class="detail-value">${file.similarity_score ? Math.round(file.similarity_score * 100) + '%' : 'N/A'}</span>
                </div>
            `;
            
            // Modal actions
            document.getElementById('copyPathBtn').onclick = () => copyToClipboard(fileUrl);
            document.getElementById('openFileBtn').onclick = () => openFile(fileUrl);
            
            // Show modal
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('File path copied to clipboard!');
            });
        }

        function openFile(filePath) {
            if (isDesktopMode) {
                if (window.pywebview) {
                    // If running in pywebview, use the API
                    window.pywebview.api.open_file(filePath);
                } else {
                    // Try to open with system default application
                    try {
                        window.open(filePath, '_blank');
                    } catch (error) {
                        showNotification('Unable to open file with system default application', 'error');
                    }
                }
            } else {
                // In web mode, open the HTTP served file
                window.open(filePath, '_blank');
            }
        }

        function showLoading() {
            loadingState.style.display = 'flex';
            emptyState.style.display = 'none';
            mediaGrid.style.display = 'none';
            mediaList.style.display = 'none';
        }

        function hideLoading() {
            loadingState.style.display = 'none';
        }

        function showEmptyState() {
            emptyState.style.display = 'block';
            mediaGrid.style.display = 'none';
            mediaList.style.display = 'none';
        }

        function hideEmptyState() {
            emptyState.style.display = 'none';
        }

        function showError(message) {
            // Simple error notification
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ef4444;
                color: white;
                padding: 15px 20px;
                border-radius: 10px;
                z-index: 1001;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            `;
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => {
                document.body.removeChild(errorDiv);
            }, 5000);
        }

        function showNotification(message, type = 'success') {
            const notificationDiv = document.createElement('div');
            
            // Set background color based on type
            let backgroundColor;
            switch (type) {
                case 'error':
                    backgroundColor = '#ef4444';
                    break;
                case 'info':
                    backgroundColor = '#3b82f6';
                    break;
                case 'warning':
                    backgroundColor = '#f59e0b';
                    break;
                case 'success':
                default:
                    backgroundColor = '#10b981';
                    break;
            }
            
            notificationDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${backgroundColor};
                color: white;
                padding: 15px 20px;
                border-radius: 10px;
                z-index: 1001;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            `;
            notificationDiv.textContent = message;
            document.body.appendChild(notificationDiv);
            
            setTimeout(() => {
                document.body.removeChild(notificationDiv);
            }, 3000);
        }
    </script>
</body>
